<!DOCTYPE html>
<html lang="id" xmlns:xlink="http://www.w3.org/1999/xlink">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3a78">
<meta name="color-scheme" content="light">
<title>Febris Sense — Skrining Cepat Demam Tropis</title>
<style>
/* ============ Design tokens (dari DESIGN.md: Clinical Diagnostic Mobile Grid) ============ */
:root{
  --primary:#002554; --pc:#0b3a78; --navy:#1a4f9c;
  --sec:#b9052c; --secc:#de2b41;
  --surface:#faf8ff; --canvas:#f4f7fb; --white:#fff;
  --sc:#e9edff; --scl:#f2f3ff; --sch:#e1e8ff; --schh:#d9e2ff;
  --ink:#0d1b36; --muted:#51607a; --label:#3b4a66; --outline:#747781; --line:#d5deea; --ovar:#c3c6d2;
  --teal:#2dd36f; --tealink:#00695c; --tealdark:#00443c;
  --amber:#e0a100; --amberbg:#fff6e0; --amberink:#6b4d00;
  --focus:#2a6fdb; --rxbg:#fde8ea; --rxtext:#a3182a;
  --hi:#b3262e; --med:#d9777e; --strip:#111111; --avatar:#cfe3fb;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --sh1:0 1px 2px rgba(20,33,61,.04); --sh2:0 4px 12px rgba(11,58,120,.08); --sh3:0 8px 24px rgba(20,33,61,.16);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);font-size:14px;line-height:20px;color:var(--ink);background:#dfe6f2;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}

/* ============ Ikon (sprite SVG, tanpa font eksternal) ============ */
.ic{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.ic.f{fill:currentColor;stroke:none}

/* ============ Shell ============ */
.app{position:relative;display:flex;flex-direction:column;width:100%;max-width:430px;height:100vh;height:100dvh;margin:0 auto;background:var(--surface);overflow:hidden}
@media (min-width:431px){.app{height:min(900px,calc(100vh - 40px));height:min(900px,calc(100dvh - 40px));margin:20px auto;border-radius:28px;box-shadow:var(--sh3)}}
.app-hdr{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:60px;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px;background:rgba(250,248,255,.92);box-shadow:0 1px 8px rgba(0,0,0,.05);z-index:5}
.hdr-l{display:flex;align-items:center;gap:10px;min-width:0}
.hdr-logo{width:32px;height:32px;flex:none}
.hdr-brand{display:flex;align-items:center;gap:6px;font-size:11px;line-height:14px;font-weight:700;letter-spacing:.5px;color:var(--pc)}
.hdr-title{font-size:15px;line-height:20px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-r{display:flex;align-items:center;gap:8px;flex:none}
.pill-sos{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:99px;background:var(--rxbg);color:var(--rxtext);font-size:11px;font-weight:700;letter-spacing:.5px;min-height:32px}
.avatar-btn{width:34px;height:34px;border-radius:50%;background:var(--pc);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.net{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:99px;background:var(--sc);color:var(--primary);font-size:10px;font-weight:700;letter-spacing:0}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--teal)}
.net.off .dot{background:var(--amber)}
.content{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
.page{display:flex;flex-direction:column;gap:12px;padding:14px 14px 28px}
.app-nav{flex:none;display:flex;justify-content:space-around;align-items:center;min-height:64px;padding:0 4px calc(env(safe-area-inset-bottom,0px));background:var(--white);border-top:1px solid var(--line);z-index:5}
.app-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:58px;min-height:48px;color:var(--muted);font-size:11px;line-height:14px;font-weight:600;border-radius:12px}
.app-nav a .ic{font-size:22px}
.app-nav a[aria-current=page]{color:var(--pc);font-weight:800}
.app-nav a.sos{color:var(--secc)}
.app-nav a.sos[aria-current=page]{color:var(--sec)}
.app[data-chrome=off] .app-hdr,.app[data-chrome=off] .app-nav{display:none}

/* ============ Komponen ============ */
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--sh1)}
.card-flat{background:var(--white);border-radius:14px;padding:14px;box-shadow:var(--sh2)}
.h-xl{font-size:28px;line-height:36px;font-weight:800;letter-spacing:-.5px;color:var(--primary)}
.h-lg{font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.2px}
.h-md{font-size:18px;line-height:24px;font-weight:700}
.t-lg{font-size:16px;line-height:22px;font-weight:700;letter-spacing:.3px}
.t-md{font-size:15px;line-height:20px;font-weight:600}
.muted{color:var(--muted)}
.lbl{display:block;font-size:13px;line-height:16px;font-weight:600;color:var(--label);margin-bottom:5px}
.micro{font-size:11px;line-height:14px;font-weight:700;letter-spacing:.5px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;background:var(--sc);color:var(--primary);font-size:11px;line-height:14px;font-weight:700;letter-spacing:.3px}
.chip.red{background:var(--rxbg);color:var(--rxtext)}
.chip.amber{background:var(--amberbg);color:var(--amberink)}
.chip.teal{background:#dcf7ea;color:var(--tealdark)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;padding:0 16px;border-radius:12px;font-weight:700;font-size:15px;transition:transform .12s,background .15s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn-p{background:var(--pc);color:#fff;box-shadow:var(--sh2)}
.btn-p:hover{background:var(--navy)}
.btn-g{background:var(--white);color:var(--pc);border:2px solid var(--pc)}
.btn-s{background:var(--scl);color:var(--pc);min-height:44px}
.btn-s:hover{background:var(--sc)}
.btn-r{background:var(--secc);color:#fff;box-shadow:var(--sh3)}
.field{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:10px;background:var(--scl);border:1px solid transparent}
.field:focus-within{border-color:var(--focus);background:var(--white)}
.field .ic{color:var(--muted);font-size:18px}
.field input,.field select,.field textarea{flex:1;min-width:0;background:transparent;border:0;outline:0;font-size:14px}
.field select{appearance:none;cursor:pointer;padding-right:18px}
.field.ta{align-items:flex-start;padding:10px 12px}
.field.ta textarea{resize:none;line-height:20px}
.field input[readonly]{color:var(--ink);opacity:.9}
.banner{display:flex;gap:10px;padding:12px;border-radius:10px;background:var(--amberbg);border-left:4px solid var(--amber);color:var(--amberink)}
.banner .ic{font-size:20px;color:var(--amber);margin-top:1px}
.banner b{display:block;color:var(--ink);margin-bottom:2px}
.banner p{font-size:13px;line-height:18px}
.banner.red{background:var(--rxbg);border-left-color:var(--hi);color:#6e0f1b}
.banner.red .ic{color:var(--hi)}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--sc)}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--pc);color:#fff;box-shadow:var(--sh1)}
.ico-tile{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.ico-tile .ic{font-size:24px}

/* ============ Splash ============ */
.splash{display:flex;flex-direction:column;justify-content:space-between;min-height:100%;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 20px}
.splash .mid{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;margin:auto 0;padding:24px 0}
.logo-wrap{position:relative;width:176px;height:176px;display:grid;place-items:center}
.logo-wrap::before{content:"";position:absolute;inset:6px;border-radius:50%;background:radial-gradient(closest-side,rgba(42,111,219,.18),rgba(222,43,65,.08) 60%,transparent);filter:blur(10px)}
.logo-wrap svg{position:relative;width:144px;height:144px;filter:drop-shadow(0 4px 6px rgba(11,58,120,.18))}
.brand-name{font-size:30px;line-height:36px;font-weight:800;letter-spacing:-.5px;color:var(--primary)}
.brand-name span{color:var(--sec)}
.tag-line{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:1.4px;color:var(--muted)}
.tag-line i{width:6px;height:6px;border-radius:50%;background:var(--focus)}
.sum-card{padding:10px 14px;border-radius:14px;background:var(--scl);max-width:340px}
.sum-card p{font-weight:500;color:var(--label)}
.sum-card .row{justify-content:center;gap:10px;margin-top:6px;font-size:11px;font-weight:600;color:var(--muted)}
.sum-card .row span{display:inline-flex;align-items:center;gap:3px}
.sum-card .ic{font-size:14px;color:var(--tealink)}
.start{display:flex;align-items:center;justify-content:space-between;width:100%;height:68px;padding:0 10px 0 24px;border-radius:20px;background:var(--pc);color:#fff;box-shadow:var(--sh3);transition:transform .12s}
.start:hover{background:var(--navy)}
.start:active{transform:scale(.98)}
.start b{font-size:26px;letter-spacing:1.5px;font-weight:800}
.start .go{width:48px;height:48px;border-radius:50%;background:#fff;color:var(--pc);display:grid;place-items:center}
.start .go .ic{font-size:26px;stroke-width:2.6}
.start .pd{width:12px;height:12px;border-radius:50%;background:var(--teal);margin-right:12px;animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(45,211,111,.55)}80%,100%{box-shadow:0 0 0 12px rgba(45,211,111,0)}}

/* ============ Login ============ */
.login{padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 28px;display:flex;flex-direction:column;gap:14px}
.login-hd{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.emblem{position:relative;width:68px;height:68px;border-radius:50%;background:var(--pc);display:grid;place-items:center;box-shadow:var(--sh2);margin-bottom:4px}
.emblem svg{width:42px;height:42px}
.emblem .ver{position:absolute;right:-4px;bottom:-4px;width:24px;height:24px;border-radius:50%;background:var(--tealdark);color:#fff;display:grid;place-items:center;border:2px solid var(--canvas)}
.emblem .ver .ic{font-size:14px}
.profile-row{display:flex;align-items:center;gap:12px}
.pfp{width:56px;height:56px;border-radius:50%;background:var(--avatar);color:var(--pc);font-weight:800;font-size:18px;display:grid;place-items:center;flex:none}
.pin-box{position:relative;flex:1;display:flex;align-items:center;justify-content:center;gap:9px;height:48px;border-radius:10px;background:var(--scl);border:1px solid transparent}
.pin-box:focus-within{border-color:var(--focus);background:var(--white)}
.pin-box input{position:absolute;inset:0;width:100%;opacity:0;cursor:text}
.pin-box i{width:14px;height:14px;border-radius:50%;background:var(--ovar);display:block;transition:background .15s}
.pin-box i.on{background:var(--pc)}
.pin-box.ok i{background:var(--teal)}
.pin-box .shown{font-weight:800;letter-spacing:10px;font-size:18px;color:var(--pc)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:18px;color:var(--label);cursor:pointer}
.check input{width:18px;height:18px;margin-top:1px;accent-color:var(--pc);flex:none}
.err{color:var(--hi);font-size:12px;font-weight:600;margin-top:4px}

/* ============ Beranda ============ */
.hello{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:4px 0 2px}
.heart-ring{position:relative;width:64px;height:64px;border-radius:50%;background:var(--sc);display:grid;place-items:center}
.heart-ring span{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--sec)}
.heart-ring span .ic{font-size:26px}
.loc{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--scl);font-size:11px;font-weight:600;color:var(--label)}
.loc .ic{color:var(--sec);font-size:15px}
.sos-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;border-radius:18px;background:var(--secc);color:#fffbff;box-shadow:var(--sh3);transition:transform .12s}
.sos-banner:active{transform:scale(.99)}
.sos-banner .ib{width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.sos-banner .ib .ic{font-size:30px}
.sos-banner .tag{padding:2px 8px;border-radius:99px;background:#fff;color:var(--sec);font-size:10px;font-weight:800;letter-spacing:.6px}
.sos-banner p{font-size:13px;line-height:18px;opacity:.95;margin-top:3px}
.sos-banner .arr{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--sec);display:grid;place-items:center;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-height:138px;padding:14px;border-radius:18px;box-shadow:var(--sh1);transition:transform .12s}
.tile:active{transform:scale(.98)}
.tile .top{display:flex;justify-content:space-between;align-items:flex-start}
.tile h2{font-size:16px;line-height:20px;font-weight:700}
.tile p{font-size:12px;line-height:16px;margin-top:3px}
.tile.dark{background:var(--pc);color:#fff}
.tile.dark p{color:var(--schh)}
.tile.dark .ico-tile{background:rgba(255,255,255,.15)}
.tile.lite{background:var(--sc)}
.tile.white{background:#fff;border:1px solid var(--line)}
.tile.lite p,.tile.white p{color:var(--muted)}
.active-pt{display:flex;align-items:center;gap:12px}
.mini-strips{display:flex;align-items:center;justify-content:center;gap:16px;padding:12px;border-radius:12px;background:var(--strip);color:var(--schh)}
.ms{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;font-weight:600}
.ms b{display:flex;flex-direction:column;justify-content:space-between;align-items:center;width:13px;height:80px;padding:4px 1px;border-radius:3px;background:#fff}
.ms b i{display:block;width:100%;height:4px;border-radius:2px}
.legend{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:600;margin-left:4px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;flex:none}

/* ============ Scan LFA ============ */
.cam{border-radius:14px;overflow:hidden;background:var(--white);border:1px solid var(--line)}
.cam-hd{display:flex;justify-content:space-between;align-items:center;padding:10px 14px}
.cam-hd .live{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13px}
.viewport{position:relative;height:210px;margin:0 12px;border-radius:12px;background:var(--strip);overflow:hidden;cursor:pointer;display:block;width:calc(100% - 24px)}
.viewport .gridl{position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px) 0 33%/100% 33.4%,linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px) 33% 0/33.4% 100%}
.viewport img.shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75}
.guide{position:absolute;left:50%;top:50%;width:150px;height:56px;transform:translate(-50%,-50%);border:2px solid #ffb020;border-radius:8px;display:flex;align-items:center;justify-content:space-around;color:#fff;font-weight:800;font-size:12px}
.guide small{position:absolute;top:-18px;left:0;font-size:10px;font-weight:700;color:#ffb020;letter-spacing:.5px}
.guide .c{color:var(--teal)}.guide .t{color:#ffb020}
.laser{position:absolute;left:12%;right:12%;top:50%;height:2px;background:var(--teal);box-shadow:0 0 12px var(--teal);opacity:.0}
.viewport.scanning .laser{opacity:1;animation:sweep 1.1s ease-in-out}
@keyframes sweep{0%{transform:translateY(-60px)}50%{transform:translateY(60px)}100%{transform:translateY(-60px)}}
.vp-hint{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center}
.vp-hint span{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.14);color:#fff;font-size:11px;font-weight:600}
.cam-ft{display:flex;gap:8px;padding:12px}
.cam-ft button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border-radius:10px;font-weight:700;font-size:13px}
.cam-ft .a{background:var(--pc);color:#fff}
.cam-ft .b{background:var(--scl);color:var(--pc)}
.strips{display:flex;justify-content:center;gap:18px;padding:6px 0 2px}
.strip{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 8px;border-radius:12px;border:2px solid transparent}
.strip[aria-pressed=true]{border-color:var(--pc);background:var(--scl)}
.strip .no{font-size:12px;font-weight:800;color:var(--muted)}
.strip .body{position:relative;width:38px;height:118px;border-radius:8px;background:#fff;border:2px solid var(--ink)}
.strip .body .wick{position:absolute;top:0;left:0;right:0;height:14px;background:#dde3ee;border-radius:5px 5px 0 0}
.strip .body .cl{position:absolute;left:4px;right:4px;top:28px;height:5px;border-radius:3px;background:var(--teal)}
.strip .body .tl{position:absolute;left:4px;right:4px;top:52px;height:6px;border-radius:3px}
.strip .body .pad{position:absolute;left:0;right:0;bottom:0;height:30px;background:#eef1f7;border-radius:0 0 5px 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:var(--muted);letter-spacing:.4px}
.strip .body .pad .ic{font-size:12px}
.strip .cap{font-size:12px;font-weight:700}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tiers button{min-height:48px;border-radius:10px;font-weight:800;font-size:15px;letter-spacing:.5px;opacity:.65;transition:transform .12s,opacity .15s}
.tiers button[aria-pressed=true]{opacity:1;transform:scale(1.04);box-shadow:var(--sh2)}
.tiers .hi{background:var(--hi);color:#fff}
.tiers .md{background:var(--med);color:#1d0408}
.tiers .ng{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.od-top{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;font-size:12px;font-weight:600;color:var(--label)}
.od-top b{font-size:14px}
.od-bar{position:relative;height:16px;margin-top:6px;border-radius:99px;border:1px solid var(--line);background:linear-gradient(90deg,#b3262e 0%,#fff 100%)}
.od-needle{position:absolute;top:-6px;width:4px;height:26px;margin-left:-2px;border-radius:2px;background:var(--ink);transition:left .45s cubic-bezier(.3,.8,.3,1)}
.od-needle[hidden]{display:none}
.od-lab{display:flex;justify-content:space-between;margin-top:5px;font-size:10px;font-weight:600;color:var(--muted)}
.res{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:14px;background:var(--scl)}
.res .row{align-items:flex-start}
.res .bd{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--schh);color:var(--pc)}
.res.hi{background:#ffdad9}.res.hi .bd{background:var(--hi);color:#fff}
.res.md{background:var(--sch)}.res.md .bd{background:var(--med);color:#1d0408}
.res.ng{background:var(--scl)}.res.ng .bd{background:#dcf7ea;color:var(--tealdark)}
.res b.ttl{font-size:15px;line-height:20px;font-weight:800;display:block}
.res .sub{font-size:12px;color:var(--label);font-weight:600}
.res p{font-size:13px;line-height:19px;color:var(--ink)}
.proto-item{display:flex;gap:10px;padding:10px;border-radius:10px;background:var(--scl)}
.proto-item .ic{color:var(--pc);font-size:20px;margin-top:1px}
.proto-item b{display:block;font-size:13px}
.proto-item span{font-size:12px;line-height:17px;color:var(--label)}
.proto-item.bad{background:var(--rxbg)}.proto-item.bad .ic{color:var(--hi)}.proto-item.bad b{color:var(--rxtext)}

/* ============ Obat ============ */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;min-height:36px;padding:0 14px;border-radius:99px;background:var(--sc);color:var(--label);font-weight:700;font-size:13px}
.chips button[aria-pressed=true]{background:var(--pc);color:#fff}
.meds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.med{display:flex;flex-direction:column;justify-content:space-between;gap:10px;padding:12px;border-radius:14px;background:#fff;border:1px solid var(--line)}
.med .art{position:relative;height:84px;border-radius:10px;display:grid;place-items:center;margin-bottom:8px}
.med .art .ic{font-size:34px}
.med .art .tg{position:absolute;top:6px;left:6px;padding:2px 8px;border-radius:99px;background:#fff;font-size:10px;font-weight:800;letter-spacing:.3px}
.med .art.rx .tg{background:var(--rxbg);color:var(--rxtext)}
.med h3{font-size:14px;line-height:18px;font-weight:700}
.med p{font-size:11.5px;line-height:16px;color:var(--muted);margin-top:3px}
.med .buy{display:flex;align-items:flex-end;justify-content:space-between;gap:6px}
.med .buy small{display:block;font-size:10px;font-weight:600;color:var(--muted)}
.med .buy b{font-size:14px;font-weight:800}
.add{width:36px;height:36px;border-radius:10px;background:var(--sc);color:var(--pc);display:grid;place-items:center}
.add:hover{background:var(--pc);color:#fff}
.stepper{display:flex;align-items:center;gap:2px;border-radius:10px;background:var(--pc);color:#fff;height:36px}
.stepper button{width:30px;height:36px;display:grid;place-items:center;color:#fff}
.stepper span{min-width:16px;text-align:center;font-weight:800;font-size:13px}
.rx-card{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-radius:12px;background:var(--rxbg);color:var(--rxtext)}
.cartbar{position:sticky;bottom:0;display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:var(--white);border:1px solid var(--line);box-shadow:var(--sh3)}

/* ============ SOS ============ */
.sos-hd{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;border-radius:16px;background:var(--hi);color:#fff}
.sos-hd .ib{width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.sos-hd h1{font-size:22px;line-height:26px;font-weight:800;letter-spacing:.3px}
.live-tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.2);font-size:11px;font-weight:800;letter-spacing:.6px}
.live-tag .dot{background:#fff;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.sos-call{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 16px;border-radius:20px;background:var(--secc);color:#fff;box-shadow:var(--sh3);animation:ring 2.2s ease-out infinite}
@keyframes ring{0%{box-shadow:0 8px 24px rgba(20,33,61,.16),0 0 0 0 rgba(215,38,61,.35)}70%,100%{box-shadow:0 8px 24px rgba(20,33,61,.16),0 0 0 14px rgba(215,38,61,0)}}
.sos-call .ib{width:56px;height:56px;border-radius:50%;background:#fff;color:var(--sec);display:grid;place-items:center;flex:none}
.sos-call .ib .ic{font-size:30px}
.sos-call b{display:block;font-size:17px;line-height:22px;font-weight:800}
.sos-call small{font-size:12px;opacity:.95}
.map{position:relative;height:140px;border-radius:12px;overflow:hidden;background:#e4edf8;margin-top:10px}
.map svg.bg{position:absolute;inset:0;width:100%;height:100%}
.map .pinm{position:absolute;left:50%;top:44%;transform:translate(-50%,-100%);color:var(--sec)}
.map .pinm .ic{font-size:36px;fill:var(--sec);stroke:#fff}
.map .coords{position:absolute;left:8px;right:8px;bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.94);font-size:12px}
.map .coords a{color:var(--focus);font-weight:700;display:inline-flex;align-items:center;gap:3px}
.notif{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.notif:first-of-type{border-top:0}
.notif .ck{width:30px;height:30px;border-radius:50%;background:#dcf7ea;color:var(--tealdark);display:grid;place-items:center;flex:none}
.notif b{display:block;font-size:13px}
.notif span{font-size:12px;color:var(--muted)}
.wa{background:#128c4a;color:#fff}
.hosp{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.hosp:first-of-type{border-top:0}
.hosp b{font-size:14px}
.hosp .km{margin-left:6px;font-size:11px;font-weight:700;color:var(--pc);background:var(--sc);border-radius:99px;padding:1px 8px}
.hosp small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.callbtn{display:inline-flex;align-items:center;gap:5px;min-height:40px;padding:0 12px;border-radius:10px;background:var(--rxbg);color:var(--rxtext);font-weight:700;font-size:12px;flex:none}

/* ============ Identitas ============ */
.idhero{position:relative;overflow:hidden;padding:14px;border-radius:16px;background:var(--pc);color:#fff}
.idhero p{color:var(--schh);font-size:13px;line-height:18px;margin-top:4px}
.idcard{display:flex;align-items:center;gap:12px}
.idcard .pfp{width:60px;height:60px;font-size:20px}
.idcard .nm{display:flex;align-items:center;gap:6px;font-size:18px;line-height:24px;font-weight:800}
.idcard .nm .ic{color:var(--focus);font-size:18px}
.vital{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.vital div{padding:10px 6px;border-radius:10px;background:var(--scl);text-align:center}
.vital small{display:block;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.3px}
.vital b{display:block;font-size:20px;line-height:24px;font-weight:800;margin:2px 0}
.vital span{font-size:10px;font-weight:700;color:var(--rxtext)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.abo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.abo button,.rh button{min-height:40px;border-radius:10px;background:var(--scl);font-weight:800;color:var(--ink)}
.abo button[aria-pressed=true],.rh button[aria-pressed=true]{background:var(--pc);color:#fff}
.rh{display:flex;gap:8px;margin-top:8px}.rh button{flex:1;font-size:12px;font-weight:700;color:var(--muted)}
.sosbox{border-radius:14px;overflow:hidden;border:1px solid #f3b6bd;background:#fff}
.sosbox .hd{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--hi);color:#fff;font-weight:800}
.sosbox .bd{display:flex;flex-direction:column;gap:12px;padding:14px}
.quick{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;flex:none}
.quick.c{background:var(--rxbg);color:var(--rxtext)}
.quick.w{background:#dcf7ea;color:#0b6b3a}
.quick .ic{font-size:20px}

/* ============ Toast & sheet ============ */
.toast{position:absolute;left:50%;top:70px;transform:translate(-50%,-14px);width:max-content;max-width:calc(100% - 28px);display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:99px;background:#23304d;color:#edf0ff;font-size:13px;font-weight:600;box-shadow:var(--sh3);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--hi);color:#fff}
.sheet-bg{position:absolute;inset:0;z-index:40;display:flex;align-items:flex-end;background:rgba(13,27,54,.45)}
.sheet{width:100%;max-height:85%;overflow-y:auto;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);border-radius:22px 22px 0 0;background:#fff;display:flex;flex-direction:column;gap:12px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet .li{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.sheet hr{border:0;border-top:1px solid var(--line)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const t = $('#toast');

  t.innerHTML = `${ic(bad ? 'warn' : 'checkc')}<span>${esc(msg)}</span>`;
  clearTimeout(toastT);

function openSheet(html, focusSel) {
  closeSheet();
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  bg.addEventListener('click', e => { if (e.target === bg) closeSheet(); });
  $('#sheetRoot').appendChild(bg);
  $$('[data-close]', bg).forEach(b => b.addEventListener('click', closeSheet));
  if (focusSel) { const fe = $(focusSel, bg); if (fe) fe.focus(); }
  return bg;
}

function miniStrip(label, lines) {
  const t = lines.map(c => `<i style="background:${c}"></i>`).join('');
  return `<div class="ms"><b>${t}<i style="background:var(--teal);height:8px;margin-top:auto"></i></b>${label}</div>`;
}

/* =====================================================================
   LAYAR 4 — SCAN LFA (Plasmodium & Viral Load)
   ===================================================================== */
function scan(arg) {
  const p = S.pasien;
  let mode = arg === 'viral' ? 'viral' : 'plasmodium';
  let tier = null, shotURL = null;
  const strip = (i, t) => {
    const col = {high:'#b3262e', med:'#d9777e', neg:'#e6ebf5'}[t];
    return `<button type="button" class="strip" data-t="${t}" aria-pressed="false" aria-label="Strip ${i}: ${TIER[t]}">
      <span class="no">${i}</span>
      <span class="body"><span class="wick"></span><span class="cl"></span><span class="tl" style="background:${col}"></span>
        <span class="pad">${ic('up')}DARAH</span></span>
      <span class="cap">${t==='high'?'Kuat':t==='med'?'Sedang':'Negatif'}</span></button>`;
  };
  return {chrome:true, html: `
  <div class="page">
    <div class="seg" role="group" aria-label="Jenis pemeriksaan">
      <button type="button" data-mode="plasmodium" aria-pressed="${mode==='plasmodium'}">${ic('flask')}Plasmodium</button>
      <button type="button" data-mode="viral" aria-pressed="${mode==='viral'}">${ic('virus')}Viral Load</button>
    </div>
    <a class="row muted" href="#/identitas" style="font-size:12px;gap:6px">${ic('user')}Pasien: <b style="color:var(--ink)">${esc(p.nama)}</b> • H+${esc(p.hari)}</a>

    <section class="cam">
      <div class="cam-hd"><span class="live"><span class="dot"></span>Kamera sensor LFA</span><span class="chip amber">Prototipe • simulasi</span></div>
      <button type="button" class="viewport" id="vp" aria-label="Ketuk untuk memindai strip">
        <span class="gridl"></span>
        <span class="guide"><small>AREA STRIP</small><span class="c">C</span><span class="t">T</span></span>
        <span class="laser"></span>
        <span class="vp-hint"><span>${ic('camera')}Ketuk untuk memindai strip</span></span>
      </button>
      <p class="muted" style="font-size:12px;padding:8px 14px 0">Letakkan kaset tegak lurus mengikuti panduan, di atas latar putih yang rata.</p>
      <div class="cam-ft">
        <button type="button" class="a" id="btnScan">${ic('camera')}Pindai kamera</button>
        <button type="button" class="b" id="btnGallery">${ic('image')}Pilih galeri</button>
        <input type="file" id="file" accept="image/*" hidden>
      </div>
    </section>

    <section class="card-flat">
      <div class="row between" style="margin-bottom:6px">
        <h2 class="t-md" id="stripTitle"></h2><span class="chip">Ketuk strip 1–3</span>
      </div>
      <div class="strips">${strip(1,'high')}${strip(2,'med')}${strip(3,'neg')}</div>
      <div class="tiers" role="group" aria-label="Tingkat beban">
        <button type="button" class="hi" data-t="high" aria-pressed="false">HIGH</button>
        <button type="button" class="md" data-t="med" aria-pressed="false">MED</button>
        <button type="button" class="ng" data-t="neg" aria-pressed="false">NEG</button>
      </div>
      <div class="od-top"><span>Rasio densitas optik (OD)</span><b id="odVal">—</b></div>
      <div class="od-bar"><span class="od-needle" id="needle" hidden></span></div>
      <div class="od-lab"><span>1,0 (beban tinggi)</span><span>0,5 (sedang)</span><span>0,0 (bersih)</span></div>
    </section>

    <section id="resBox"></section>
    <section id="protoBox"></section>

    <div class="banner">${ic('warn')}<div><b>Peringatan diagnosis cepat</b><p>Hasil citra optik perlu dikonfirmasi gejala klinis dan riwayat endemisitas setempat sebelum pemberian antimalaria atau terapi lain.</p></div></div>

    <button type="button" class="btn btn-p" id="btnSave" disabled>${ic('save')}Simpan hasil ke rekam pasien</button>
    <a class="btn btn-g" href="#/obat" id="toObat">${ic('pill')}Lanjut beli obat${ic('arrow')}</a>
  </div>`, bind() {
    const paint = () => {
      $$('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === mode));
      $('#stripTitle').textContent = mode === 'viral' ? 'VIRAL LOAD (DENGUE / ZIKA)' : 'PLASMODIUM LOAD';
      $$('.strip,.tiers button').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === tier));
      const nd = $('#needle');
      if (!tier) {
        nd.hidden = true; $('#odVal').textContent = '—'; $('#odVal').style.color = '';
        $('#resBox').innerHTML = `<div class="res"><div class="row"><div class="bd">${ic('camera')}</div><div><b class="ttl">Belum ada hasil</b><span class="sub">Pindai strip, atau pilih tingkat 1–3 secara manual.</span></div></div></div>`;
        $('#protoBox').innerHTML = ''; $('#btnSave').disabled = true; return;
      }
      const r = RES[mode][tier];
      nd.hidden = false; nd.style.left = Math.min(96, Math.max(3, (1 - OD[tier]) * 100)) + '%';
      $('#odVal').textContent = OD[tier].toFixed(2).replace('.', ',') + ' OD (' + TIER[tier] + ')';
      $('#odVal').style.color = tier === 'high' ? 'var(--hi)' : tier === 'med' ? '#a3182a' : 'var(--label)';
      $('#resBox').innerHTML = `<div class="res ${r.tone}"><div class="row"><div class="bd">${ic(r.icon)}</div><div><b class="ttl">${r.title}</b><span class="sub">${r.sub}</span></div></div><p>${r.text}</p></div>`;
      $('#protoBox').innerHTML = tier === 'neg' ? '' : `<div class="card-flat"><div class="row between" style="margin-bottom:10px"><h3 class="t-md row" style="gap:6px">${ic('hosp')}Protokol klinis</h3><span class="chip">Kemenkes RI</span></div><div style="display:flex;flex-direction:column;gap:8px">${PROTO[mode].map(x => `<div class="proto-item ${x.bad ? 'bad' : ''}">${ic(x.i)}<div><b>${x.t}</b><span>${x.d}</span></div></div>`).join('')}</div></div>`;
      $('#btnSave').disabled = false;
    };
    const pick = t => { tier = t; paint(); };
    $$('[data-mode]').forEach(b => b.addEventListener('click', () => { mode = b.dataset.mode; tier = null; history.replaceState(null, '', '#/scan/' + mode); paint(); }));
    $$('.strip,.tiers button').forEach(b => b.addEventListener('click', () => pick(b.dataset.t)));
    const run = () => {
      const vp = $('#vp'); vp.classList.remove('scanning'); void vp.offsetWidth; vp.classList.add('scanning');
      (navigator.vibrate && navigator.vibrate(25));
      setTimeout(() => { vp.classList.remove('scanning'); pick(['high','med','neg'][Math.floor(Math.random()*3)]); }, 1150);
    };
    $('#vp').addEventListener('click', run);
    $('#btnScan').addEventListener('click', run);
    $('#btnGallery').addEventListener('click', () => $('#file').click());
    $('#file').addEventListener('change', e => {
      const f = e.target.files[0]; if (!f) return;
      if (shotURL) URL.revokeObjectURL(shotURL);
      shotURL = URL.createObjectURL(f);
      const old = $('#vp img.shot'); if (old) old.remove();
      const img = document.createElement('img'); img.className = 'shot'; img.alt = 'Foto strip yang dipilih'; img.src = shotURL;
      $('#vp').prepend(img); run();
    });
    $('#btnSave').addEventListener('click', () => {
      if (!tier) return;
      S.hasil = {mode, tier, od: OD[tier], at: Date.now()};
      persist(); toast('Hasil ' + hasilLabel(S.hasil) + ' tersimpan ke rekam ' + S.pasien.nama.split(' ')[0]);
    });
    $('#toObat').addEventListener('click', () => {
      if (tier && (!S.hasil || S.hasil.mode !== mode || S.hasil.tier !== tier)) { S.hasil = {mode, tier, od: OD[tier], at: Date.now()}; persist(); }
    });
    paint();
  }};
}

/* =====================================================================
   LAYAR 5 — BELI OBAT
   ===================================================================== */
function obat() {
  const h = S.hasil;
  let filter = h && h.tier !== 'neg' ? (h.mode === 'viral' ? 'demam' : 'malaria') : 'all';
  const cnt = () => Object.values(S.cart).reduce((a, b) => a + b, 0);
  const total = () => Object.entries(S.cart).reduce((a, [id, q]) => a + ((MEDS.find(m => m.id === id) || {}).p || 0) * q, 0);
  const chips = [['all','Semua'],['demam','Dengue & demam'],['malaria','Malaria ACT'],['rehidrasi','Rehidrasi']];
  const dengue = h && h.mode === 'viral' && h.tier !== 'neg';
  return {chrome:true, html: `
  <div class="page">
    <div class="banner red">${ic('ban')}<div><b>Peringatan protokol demam</b><p>Pada dugaan <strong>dengue</strong>, hindari <strong>Aspirin</strong>, <strong>Ibuprofen</strong>, dan asam mefenamat (risiko perdarahan). Utamakan <strong>parasetamol</strong> dan rehidrasi.</p></div></div>
    ${h ? `<div class="card row" style="padding:10px 12px;gap:10px">${ic(h.mode==='viral'?'virus':'flask')}<div class="grow"><div class="micro muted">HASIL SCAN TERAKHIR</div><b>${esc(hasilLabel(h))}</b> <span class="muted" style="font-size:12px">• ${esc(S.pasien.nama)}</span></div></div>` : ''}
    <div class="chips" id="chips" role="group" aria-label="Kategori obat"></div>
    <div class="meds" id="meds"></div>
    <div class="rx-card"><div class="row">${ic('file')}<div><b style="display:block">Resep terverifikasi dr. Hendra</b><span style="font-size:12px">ID: RX-2025-0982-SITI</span></div></div><span class="chip teal">${ic('check')}Valid</span></div>
    <div class="cartbar" id="cartbar"></div>
  </div>`, bind() {
    const drawChips = () => {
      const n = id => id === 'all' ? MEDS.length : MEDS.filter(m => m.c === id).length;
      $('#chips').innerHTML = chips.map(([id, l]) => `<button type="button" data-f="${id}" aria-pressed="${filter===id}">${l} (${n(id)})</button>`).join('');
      $$('#chips button').forEach(b => b.addEventListener('click', () => { filter = b.dataset.f; drawChips(); drawMeds(); }));
    };
    const drawMeds = () => {
      const list = MEDS.filter(m => filter === 'all' || m.c === filter);
      $('#meds').innerHTML = list.map(m => {
        const q = S.cart[m.id] || 0;
        return `<article class="med"><div>
          <div class="art ${m.rx ? 'rx' : ''}" style="background:${m.bg};color:${m.fg}">${ic(m.i)}<span class="tg" style="color:${m.fg}">${m.tag}</span></div>
          <h3>${esc(m.n)}</h3><p>${esc(m.d)}</p></div>
          <div class="buy"><div><small>${m.sub ? 'Subsidi Dinkes' : 'Harga'}</small><b>${rp(m.p)}</b></div>
          ${q ? `<div class="stepper"><button type="button" data-d="-1" data-id="${m.id}" aria-label="Kurangi ${esc(m.n)}">${ic('minus')}</button><span>${q}</span><button type="button" data-d="1" data-id="${m.id}" aria-label="Tambah ${esc(m.n)}">${ic('plus')}</button></div>`
                : `<button type="button" class="add" data-d="1" data-id="${m.id}" aria-label="Tambah ${esc(m.n)}">${ic('plus')}</button>`}</div></article>`;
      }).join('');
      $$('#meds [data-id]').forEach(b => b.addEventListener('click', () => {
        const id = b.dataset.id, q = Math.max(0, (S.cart[id] || 0) + Number(b.dataset.d));
        if (q) S.cart[id] = q; else delete S.cart[id];
        persist(); drawMeds(); drawCart();
      }));
    };
    const drawCart = () => {
      $('#cartbar').innerHTML = `<div class="row between"><span class="muted"><b>Total pilihan</b> (${cnt()} item)</span><b class="h-md">${rp(total())}</b></div>
        <button type="button" class="btn btn-p" id="checkout" ${cnt() ? '' : 'disabled'}>${ic('cart')}Beli sekarang</button>`;
      $('#checkout').addEventListener('click', checkout);
    };
    const checkout = () => {
      const lines = Object.entries(S.cart).map(([id, q]) => ({m: MEDS.find(x => x.id === id), q})).filter(x => x.m);
      const hasRx = lines.some(l => l.m.rx);
      const bg = openSheet(`
        <div class="t-lg">Ringkasan pesanan</div>
        <div class="muted" style="font-size:12px">Untuk pasien: <b style="color:var(--ink)">${esc(S.pasien.nama)}</b></div>
        ${lines.map(l => `<div class="li"><span>${l.q}× ${esc(l.m.n)}${l.m.rx ? ' <span class="chip red" style="margin-left:4px">Rx</span>' : ''}</span><b>${rp(l.m.p * l.q)}</b></div>`).join('')}
        <hr><div class="li"><b>Total</b><b class="h-md">${rp(total())}</b></div>
        ${hasRx ? `<div class="banner">${ic('file')}<div><p>Obat bertanda <b style="display:inline">Rx</b> diserahkan petugas farmasi sesuai resep <b style="display:inline">RX-2025-0982-SITI</b>.</p></div></div>` : ''}
        <button class="btn btn-p" id="confirmBuy">${ic('checkc')}Konfirmasi pesanan</button>
        <button class="btn btn-s" data-close>Kembali</button>`, '#confirmBuy');
      $('#confirmBuy', bg).addEventListener('click', () => {
        S.cart = {}; persist(); closeSheet(); drawMeds(); drawCart();
        toast('Pesanan tercatat. Petugas farmasi akan menyiapkan obat.');
      });
    };
    drawChips(); drawMeds(); drawCart();
  }};
}

/* =====================================================================
   LAYAR 6 — SOS
   ===================================================================== */
const waNum = raw => { const d = String(raw).replace(/\D/g, ''); return d.startsWith('62') ? d : d.startsWith('0') ? '62' + d.slice(1) : '62' + d; };
function sos() {
  const p = S.pasien, L = S.lokasi;
  const alamat = L.alamat || p.alamat;
  return {chrome:true, html: `
  <div class="page">
    <div class="sos-hd">
      <div class="row" style="gap:12px"><div class="ib">${ic('phone')}</div>
        <div><span class="micro" style="opacity:.9">SISTEM SIAGA AKTIF</span><h1>EMERGENCY MODE</h1></div></div>
      <span class="live-tag"><span class="dot"></span>LIVE</span>
    </div>

    <a class="sos-call" href="tel:119" id="call119">
      <div class="row" style="gap:12px"><div class="ib">${ic('sos')}</div>
        <div><b>PANGGIL AMBULANS &amp; TIM</b><small>Tanggap darurat 119</small></div></div>
      ${ic('phone')}
    </a>

    <section class="card-flat">
      <div class="row between"><h2 class="t-md row" style="gap:6px;color:var(--sec)">${ic('pin')}<span style="color:var(--ink)">Lokasi GPS pasien</span></h2>
        <span class="chip ${L.akurasi ? 'teal' : 'amber'}" id="accChip">${L.akurasi ? 'Akurat ±' + Math.round(L.akurasi) + ' m' : 'Koordinat contoh'}</span></div>
      <div class="map" aria-label="Pratinjau peta">
        <svg class="bg" viewBox="0 0 400 140" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <rect width="400" height="140" fill="#e4edf8"/><path d="M0 100 C80 80 140 120 220 90 S340 60 400 80" stroke="#bcd3ec" stroke-width="16" fill="none"/>
          <g stroke="#fff" stroke-width="7" fill="none"><path d="M40 0 L90 140"/><path d="M0 50 L400 38"/><path d="M200 0 L230 140"/><path d="M320 0 L300 140"/></g>
          <g stroke="#cfdcec" stroke-width="2" fill="none"><path d="M0 95 L400 88"/><path d="M120 0 L150 140"/></g>
        </svg>
        <span class="pinm">${ic('pin')}</span>
        <div class="coords"><span><b>Koordinat</b> <span id="coordTxt">${L.lat.toFixed(4)}°, ${L.lng.toFixed(4)}°</span></span>
          <a id="mapLink" href="https://maps.google.com/?q=${L.lat},${L.lng}" target="_blank" rel="noopener noreferrer">Buka peta${ic('arrow')}</a></div>
      </div>
      <p class="muted row" style="font-size:12px;margin-top:10px;align-items:flex-start">${ic('pin')}<span id="addrTxt">${esc(alamat)}</span></p>
      <button class="btn btn-s" id="btnLoc" style="margin-top:10px">${ic('locate')}Perbarui lokasi GPS</button>
    </section>

    <section class="card-flat">
      <div class="row between" style="margin-bottom:4px"><h2 class="t-md row" style="gap:6px">${ic('radio')}Status notifikasi darurat</h2><span class="chip">Siap kirim</span></div>
      <div class="notif"><div class="row"><div class="ck">${ic('check')}</div><div><b>RS rujukan terdekat (IGD)</b><span>Ringkasan pasien disiapkan</span></div></div><span class="chip teal">Siap</span></div>
      <div class="notif"><div class="row"><div class="ck">${ic('check')}</div><div><b>Rekam skrining LFA</b><span>${S.hasil ? esc(hasilLabel(S.hasil)) : 'Belum ada hasil scan'}</span></div></div><span class="chip ${S.hasil ? 'teal' : 'amber'}">${S.hasil ? 'Terlampir' : 'Kosong'}</span></div>
      <div class="notif"><div class="row"><div class="ck">${ic('check')}</div><div><b>Kontak darurat keluarga</b><span>${esc(p.kontakNama)}</span></div></div><span class="chip teal">Siap kirim</span></div>
      <button class="btn wa" id="btnWa" style="margin-top:10px">${ic('chat')}Kirim lokasi via WhatsApp ke keluarga</button>
    </section>

    <section class="card-flat">
      <div class="row between" style="margin-bottom:4px"><h2 class="t-md row" style="gap:6px">${ic('hosp')}IGD terdekat</h2><span class="chip">24 jam</span></div>
      ${HOSP.map(x => `<div class="hosp"><div class="grow"><b>${esc(x.n)}</b><span class="km">${x.km}</span><small>${esc(x.d)}</small></div><a class="callbtn" href="tel:${x.tel}" aria-label="Telepon ${esc(x.n)}">${ic('phone')}${esc(x.lab)}</a></div>`).join('')}
    </section>

    <div class="banner">${ic('warn')}<div><b>Penanganan awal syok / demam kritis</b><p>Baringkan pasien dan tinggikan kaki bila pusing berat, ujung jari dingin, atau muntah terus-menerus. Beri minum sedikit demi sedikit hanya bila pasien sadar dan tidak muntah. Tetap hubungi 119 dan jangan tinggalkan pasien sendirian.</p></div></div>
  </div>`, bind() {
    $('#btnWa').addEventListener('click', () => {
      const L2 = S.lokasi, q = `${L2.lat},${L2.lng}`;
      const msg = `DARURAT FEBRIS SENSE: Mohon bantuan untuk ${p.nama} (${p.umur} th), demam tinggi H+${p.hari}${S.hasil ? ', hasil LFA ' + hasilLabel(S.hasil) : ''}. Lokasi: https://maps.google.com/?q=${q}`;
      window.open(`https://api.whatsapp.com/send?phone=${waNum(p.kontakHp)}&text=${encodeURIComponent(msg)}`, '_blank', 'noopener');
    });
    $('#btnLoc').addEventListener('click', () => {
      if (!navigator.geolocation) return toast('Perangkat tidak mendukung GPS', true);
      toast('Mencari lokasi…');
      navigator.geolocation.getCurrentPosition(pos => {
        S.lokasi = {lat: pos.coords.latitude, lng: pos.coords.longitude, alamat: '', akurasi: pos.coords.accuracy}; persist();
        $('#coordTxt').textContent = `${S.lokasi.lat.toFixed(4)}°, ${S.lokasi.lng.toFixed(4)}°`;
        $('#mapLink').href = `https://maps.google.com/?q=${S.lokasi.lat},${S.lokasi.lng}`;
        const a = $('#accChip'); a.className = 'chip teal'; a.textContent = 'Akurat ±' + Math.round(S.lokasi.akurasi) + ' m';
        toast('Lokasi GPS diperbarui');
      }, () => toast('Izin lokasi ditolak atau gagal', true), {enableHighAccuracy: true, timeout: 8000});
    });
  }};
}

/* =====================================================================
   LAYAR 7 — IDENTITAS PASIEN
   ===================================================================== */
const maskNik = n => { const d = String(n).replace(/\D/g, ''); return d.length >= 8 ? d.slice(0,4) + '********' + d.slice(-4) : (d || 'belum diisi'); };
function identitas() {
  const p = S.pasien, h = S.hasil;
  return {chrome:true, html: `
  <div class="page">
    <div class="idhero">
      <div class="row between"><span class="chip" style="background:rgba(255,255,255,.18);color:#fff">${ic('badge')}FEBRIS SENSE ID</span>
        <span class="chip" style="background:rgba(255,255,255,.18);color:#fff"><span class="dot"></span>Posko aktif</span></div>
      <h1 class="h-lg" style="margin-top:10px">Identitas Pribadi Pasien</h1>
      <p>Data dipakai untuk membaca hasil LFA, triase demam akut, dan sinyal darurat SOS.</p>
    </div>

    <section class="card-flat">
      <div class="idcard">
        <div class="pfp">${initials(p.nama)}</div>
        <div class="grow">
          <div class="nm"><span>${esc(p.nama)}</span>${ic('verified')}</div>
          <div class="muted" style="font-size:12px">NIK: ${esc(maskNik(p.nik))}</div>
          <div class="row" style="gap:6px;margin-top:6px;flex-wrap:wrap">
            <span class="chip">${ic('hosp')}${esc(S.nakes.faskes.split(' (')[0].split(' • ')[0])}</span>
            <span class="chip red">Hari sakit: H+${esc(p.hari)}</span>
            ${h ? `<span class="chip amber">LFA: ${esc(hasilLabel(h))}</span>` : ''}
          </div>
        </div>
      </div>
      <div class="vital">
        <div><small>SUHU</small><b>${esc(p.suhu)}°</b><span>°C</span></div>
        <div><small>TROMBOSIT</small><b>${esc(p.trombosit)}k</b><span>/µL</span></div>
        <div><small>TEKANAN</small><b>${esc(p.tekanan)}</b><span>mmHg</span></div>
      </div>
    </section>

    <form class="card-flat" id="idForm" style="display:flex;flex-direction:column;gap:14px" novalidate>
      <div><label class="lbl" for="fNama">Nama lengkap pasien *</label>
        <div class="field">${ic('user')}<input id="fNama" value="${esc(p.nama)}" placeholder="Nama lengkap pasien" autocomplete="off"></div></div>
      <div><label class="lbl" for="fNik">NIK (16 digit)</label>
        <div class="field">${ic('badge')}<input id="fNik" value="${esc(p.nik)}" inputmode="numeric" maxlength="16" autocomplete="off"></div></div>
      <div class="split">
        <div><label class="lbl" for="fUmur">Umur *</label><div class="field">${ic('cal')}<input id="fUmur" type="number" min="0" max="120" value="${esc(p.umur)}"><span class="muted">th</span></div></div>
        <div><label class="lbl" for="fKel">Kelamin *</label><div class="field">${ic('user')}<select id="fKel"><option ${p.kelamin==='Perempuan'?'selected':''}>Perempuan</option><option ${p.kelamin==='Laki-laki'?'selected':''}>Laki-laki</option></select>${ic('chev')}</div></div>
      </div>
      <div>
        <div class="row between"><span class="lbl">Golongan darah &amp; rhesus *</span></div>
        <div class="abo" role="group" aria-label="Golongan darah">${['A','B','AB','O'].map(g => `<button type="button" data-g="${g}" aria-pressed="${p.gol===g}">${g}</button>`).join('')}</div>
        <div class="rh" role="group" aria-label="Rhesus"><button type="button" data-r="+" aria-pressed="${p.rh==='+'}">Rhesus positif (+)</button><button type="button" data-r="-" aria-pressed="${p.rh==='-'}">Rhesus negatif (−)</button></div>
      </div>
      <div>
        <div class="row between"><label class="lbl" for="fAlamat">Alamat domisili *</label>
          <button type="button" class="chip" id="gpsFill" style="background:none;color:var(--focus)">${ic('locate')}Pakai GPS</button></div>
        <div class="field ta">${ic('pin')}<textarea id="fAlamat" rows="2">${esc(p.alamat)}</textarea></div>
      </div>
      <div><label class="lbl" for="fRiw">Riwayat penyakit &amp; alergi</label>
        <div class="field ta">${ic('file')}<textarea id="fRiw" rows="2">${esc(p.riwayat)}</textarea></div></div>
      <div class="split">
        <div><label class="lbl" for="fHari">Hari sakit (H+)</label><div class="field"><input id="fHari" type="number" min="0" max="30" value="${esc(p.hari)}"></div></div>
        <div><label class="lbl" for="fSuhu">Suhu (°C)</label><div class="field">${ic('thermo')}<input id="fSuhu" inputmode="decimal" value="${esc(p.suhu)}"></div></div>
        <div><label class="lbl" for="fTrom">Trombosit (×1000/µL)</label><div class="field"><input id="fTrom" inputmode="numeric" value="${esc(p.trombosit)}"></div></div>
        <div><label class="lbl" for="fTek">Tekanan darah</label><div class="field"><input id="fTek" value="${esc(p.tekanan)}" placeholder="110/75"></div></div>
      </div>

      <div class="sosbox">
        <div class="hd"><span class="row" style="gap:6px">${ic('sos')}Kontak darurat (SOS)</span><span class="micro">WAJIB DIISI</span></div>
        <div class="bd">
          <div><label class="lbl" for="fKn">Nama kontak / hubungan</label><div class="field">${ic('users')}<input id="fKn" value="${esc(p.kontakNama)}" placeholder="Nama anggota keluarga"></div></div>
          <div><label class="lbl" for="fKh">Nomor telepon / WhatsApp aktif *</label>
            <div class="row"><div class="field grow">${ic('phone')}<input id="fKh" type="tel" inputmode="tel" value="${esc(p.kontakHp)}"></div>
              <a class="quick c" id="kCall" href="tel:${esc(p.kontakHp.replace(/[^\d+]/g,''))}" aria-label="Telepon kontak darurat">${ic('phone')}</a>
              <a class="quick w" id="kWa" href="https://wa.me/${waNum(p.kontakHp)}" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp kontak darurat">${ic('chat')}</a></div></div>
          <p class="muted" style="font-size:12px">Nomor ini menerima koordinat GPS dan ringkasan hasil LFA bila Anda mengirim SOS dari layar Darurat.</p>
        </div>
      </div>
      <p class="err" id="idErr" hidden></p>
      <button type="submit" class="btn btn-p" id="btnSaveId">${ic('save')}Simpan identitas pasien</button>
      <button type="button" class="btn btn-s" id="btnSatu">${ic('verified')}Sinkronisasi NIK / SATUSEHAT</button>
      <a class="btn btn-g" href="#/scan/plasmodium">Lanjut ke scan LFA${ic('arrow')}</a>
    </form>
  </div>`, bind() {
    let gol = p.gol, rh = p.rh;
    $$('[data-g]').forEach(b => b.addEventListener('click', () => { gol = b.dataset.g; $$('[data-g]').forEach(x => x.setAttribute('aria-pressed', x === b)); }));
    $$('[data-r]').forEach(b => b.addEventListener('click', () => { rh = b.dataset.r; $$('[data-r]').forEach(x => x.setAttribute('aria-pressed', x === b)); }));
    const syncLinks = () => {
      const v = $('#fKh').value;
      $('#kCall').href = 'tel:' + v.replace(/[^\d+]/g, '');
      $('#kWa').href = 'https://wa.me/' + waNum(v);
    };
    $('#fKh').addEventListener('input', syncLinks);
    $('#gpsFill').addEventListener('click', () => {
      const ta = $('#fAlamat');
      if (!navigator.geolocation) return toast('Perangkat tidak mendukung GPS', true);
      const old = ta.value; ta.value = 'Mendeteksi koordinat GPS…';
      navigator.geolocation.getCurrentPosition(pos => {
        ta.value = `Koordinat GPS: ${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)} (lengkapi nama jalan)`;
      }, () => { ta.value = old; toast('Izin lokasi ditolak atau gagal', true); }, {timeout: 8000});
    });
    $('#idForm').addEventListener('submit', e => {
      e.preventDefault();
      const er = $('#idErr'), v = id => $('#' + id).value.trim();
      const umur = Number(v('fUmur'));
      if (!v('fNama')) { er.textContent = 'Nama pasien wajib diisi.'; er.hidden = false; return $('#fNama').focus(); }
      if (!(umur >= 0 && umur <= 120) || v('fUmur') === '') { er.textContent = 'Umur harus 0–120 tahun.'; er.hidden = false; return $('#fUmur').focus(); }
      if (!v('fAlamat')) { er.textContent = 'Alamat domisili wajib diisi.'; er.hidden = false; return $('#fAlamat').focus(); }
      if (v('fKh').replace(/\D/g, '').length < 9) { er.textContent = 'Nomor kontak darurat wajib diisi dengan benar.'; er.hidden = false; return $('#fKh').focus(); }
      er.hidden = true;
      S.pasien = {nama:v('fNama'), nik:v('fNik'), umur, kelamin:v('fKel'), gol, rh, alamat:v('fAlamat'), riwayat:v('fRiw'),
        hari:v('fHari') || 0, suhu:v('fSuhu'), trombosit:v('fTrom'), tekanan:v('fTek'), kontakNama:v('fKn'), kontakHp:v('fKh')};
      persist();
      const b = $('#btnSaveId'); b.disabled = true; b.innerHTML = `${ic('save')}Menyimpan…`;
      setTimeout(() => { render(); toast('Identitas tersimpan di perangkat ini'); }, 450);
    });
    $('#btnSatu').addEventListener('click', () => toast('Simulasi: API SATUSEHAT belum terhubung di prototipe ini'));
  }};
}

/* =====================================================================
   ROUTER
   ===================================================================== */
const ROUTES = {splash, login, beranda, scan, obat, sos, identitas};
function render() {
  let [name, arg] = (location.hash.replace(/^#\/?/, '') || 'splash').split('/');
  if (!ROUTES[name]) name = 'splash';
  if (!AUTH && name !== 'splash' && name !== 'login') { location.replace('#/login'); return; }
  closeSheet();
  const scr = ROUTES[name](arg);
  const app = $('#app');
  app.dataset.chrome = scr.chrome ? 'on' : 'off';
  if (scr.chrome) drawChrome(name);
  $('#main').innerHTML = scr.html;
  $('#main').scrollTop = 0;
  scr.bind && scr.bind();
}
function safeRender() {
  try { render(); }
  catch (e) {
    try { $('#app').dataset.chrome = 'off'; } catch (_) {}
    $('#main').innerHTML = '<div style="padding:24px"><h2 style="margin-bottom:8px">Terjadi kesalahan</h2><p style="margin-bottom:12px">Muat ulang halaman. Jika masih gagal, hapus data situs lalu buka lagi.</p><button onclick="try{localStorage.removeItem(KEY)}catch(e){};location.hash=\'\';location.reload()" style="padding:12px 16px;border-radius:12px;background:#0b3a78;color:#fff;font-weight:700">Reset &amp; muat ulang</button><pre style="margin-top:12px;font-size:11px;white-space:pre-wrap;color:#a3182a">' + esc(e && e.message) + '</pre></div>';
  }
}
window.addEventListener('hashchange', safeRender);
safeRender();
</script>
</body>
</html>
